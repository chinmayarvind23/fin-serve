# Required image digests and model commits have no deployable defaults.
ray:
  image: ""
  version: "2.58.0"
  importPath: finserve.engines.ray_backends:build_application
  capacityPerWorker: 16
  workers: 2
engine:
  image: ""
  # Existing PVC root contains the exact verified snapshot; startup rehashes every file.
  modelClaim: ""
