name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - run: uv sync --frozen --extra reference --extra multimodal --extra cache --extra registry --extra visual-worker --extra visual-proto --extra explorer --extra vision --extra telemetry
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest --cov=finserve --cov-report=term-missing --cov-fail-under=85
      - run: uv run --no-sync python scripts/check_semantic_mutations.py --output "$RUNNER_TEMP/finserve-mutations"
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - name: Install checksummed Helm 3.19.0
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "FINSERVE_HELM=$RUNNER_TEMP/linux-amd64/helm" >> "$GITHUB_ENV"
      - name: Resolve pinned operator charts
        run: '"$FINSERVE_HELM" dependency build infra/kubernetes/operators'
      - name: Validate actual Helm output and RayService schema
        run: >-
          uv run --isolated --no-project --with pytest --with pyyaml --with jsonschema
          python -m pytest tests/contract/test_infrastructure.py -q -o addopts=
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scrape configuration and alert rules
        run: >-
          docker run --rm --network none
          --entrypoint /bin/promtool
          -v "$GITHUB_WORKSPACE/monitoring:/etc/prometheus:ro"
          -w /etc/prometheus
          quay.io/prometheus/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          check config /etc/prometheus/prometheus.yml
      - name: Test alert timing and traffic populations
        run: >-
          docker run --rm --network none
          --entrypoint /bin/promtool
          -v "$GITHUB_WORKSPACE/monitoring:/etc/prometheus:ro"
          -w /etc/prometheus
          quay.io/prometheus/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          test rules /etc/prometheus/alerts.test.yml
