apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-runtime
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-engine
spec:
  replicas: 1
  # One physical GPU cannot support a surge pod; candidate validation needs separate capacity.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}-engine}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-engine, finserve.io/component: engine}
      annotations:
        finserve.io/profile-sha256: {{ .Values.engine.profileSha256 | quote }}
    spec:
      serviceAccountName: {{ .Release.Name }}-runtime
      terminationGracePeriodSeconds: 120
      nodeSelector: {finserve.io/pool: gpu}
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: engine
          image: {{ .Values.engine.image | quote }}
          command: [python3, -m, finserve.registry.engine_entrypoint]
          args:
            - --profile
            - /run/finserve/profile.json
            - --profile-sha256
            - {{ .Values.engine.profileSha256 | quote }}
            - --expected-model
            - {{ .Values.engine.servedModel | quote }}
            - --expected-base-url
            - {{ printf "http://%s-engine:8000/v1" .Release.Name | quote }}
            - --expected-credential-env
            - FINSERVE_ENGINE_API_KEY
          env:
            - name: FINSERVE_ENGINE_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.engine.credentialsSecret | quote }}, key: api-key}
          ports: [{name: http, containerPort: 8000}]
          resources:
            requests: {cpu: "3", memory: 12Gi, ephemeral-storage: 2Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "3", memory: 12Gi, ephemeral-storage: 8Gi, nvidia.com/gpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: {{ div .Values.engine.startupSeconds 10 }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - {name: model, mountPath: /models, readOnly: true}
            - {name: profile, mountPath: /run/finserve, readOnly: true}
            # Triton loads generated native libraries here; this volume must permit execution.
            - {name: scratch, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: {{ .Values.engine.modelClaim | quote }}
            readOnly: true
        - name: profile
          configMap:
            name: {{ .Values.engine.profileConfigMap | quote }}
            items: [{key: profile.json, path: profile.json}]
        - name: scratch
          emptyDir: {sizeLimit: 8Gi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-engine
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-engine}
  ports: [{name: http, port: 8000, targetPort: http}]
