# Required image digests and model commits have no deployable defaults.
ray:
  image: ""
  version: "2.58.0"
  importPath: finserve.engines.ray_backends:build_application
  capacityPerWorker: 16
  workers: 2
  # CPU Ray resource demand only; one fixed router/proxy pair does not scale with HTTP load.
  autoscaling:
    enabled: false
    idleTimeoutSeconds: 60
engine:
  image: ""
  # Existing PVC root contains the exact verified snapshot; startup rehashes every file.
  modelClaim: ""
  # Existing immutable ConfigMap has profile.json; the digest is canonical ServingProfileV1.
  profileConfigMap: ""
  profileSha256: ""
  servedModel: finserve-qwen
  credentialsSecret: ""
  startupSeconds: 900
evidenceRoleArn: ""
gateway:
  enabled: false
  image: ""
  sourceRevision: ""
  # Distinct api-key and ray-api-key values; engine credentials stay in the engine Secret.
  credentialsSecret: ""
  maxConcurrency: 16
