[project]
name = "finserve"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "prometheus-client>=0.21,<1", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
reference = ["torch>=2.6,<3"]
distributed = ["ray[serve]>=2.40,<3", "redis>=5,<7"]
registry = ["sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "mlflow>=3,<4", "boto3>=1.35,<2"]
multimodal = ["jax>=0.6,<1", "flax>=0.10,<1", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pyright>=1.1.400,<2", "mutmut>=3,<4"]

[tool.ruff]
line-length = 100
[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
source = ["finserve"]
branch = true

[tool.hatch.build.targets.wheel]
packages = ["src/finserve"]
